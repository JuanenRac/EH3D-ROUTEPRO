name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Manifest, documentation and language parity
        run: python -I tools/ci_validate.py

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: EH3D-ROUTEPRO
      - name: Check out the sibling EH3D-DRILLPRO (a path dependency)
        uses: actions/checkout@v5
        with:
          repository: JuanenRac/EH3D-DRILLPRO
          path: EH3D-DRILLPRO
      - name: Check out the sibling EH3D-COMMON (a path dependency)
        uses: actions/checkout@v5
        with:
          repository: JuanenRac/EH3D-COMMON
          path: EH3D-COMMON
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --all --check
        working-directory: EH3D-ROUTEPRO
      - name: Lints
        run: cargo clippy --workspace --all-targets --features console -- -D warnings
        working-directory: EH3D-ROUTEPRO
      - name: Tests
        run: cargo test --workspace --all-targets --features console
        working-directory: EH3D-ROUTEPRO
