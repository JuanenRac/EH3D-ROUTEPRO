[package]
name = "eh3d-routepro"
version = "0.1.5"
edition = "2021"
description = "Open implementation of the Bungard CCD routing workflow (HP-GL input and machine protocol)"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-ROUTEPRO"
readme = "README.md"

[workspace]
members = ["protocol"]

[features]
default = []
gui = ["eh3d-drillpro/gui", "dep:eframe"]
console = ["eh3d-drillpro/console"]

[dependencies]
# the files of the Bungard machines (HP-GL file, tool table), shared with DRILLPRO and the modern interface
eh3d-bungard-formats = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/formats" }
eh3d-levelling = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/levelling" }
eh3d-summary = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/summary" }
serde_json = "1"
eh3d-routepro-protocol = { path = "protocol" }
eh3d-drillpro = { version = ">=0.1.4", path = "../EH3D-DRILLPRO" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"], optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland"], optional = true }

[[bin]]
name = "routepro"
path = "src/bin/routepro.rs"
required-features = ["gui"]

[[bin]]
name = "routepro-console"
path = "src/bin/routepro_console.rs"
required-features = ["console"]

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.dev]
# a lighter debug build: the file and line of a panic stay, the full debug symbols (the bulk of the target folder) do not
debug = "line-tables-only"

[[bin]]
name = "routepro-plan"
path = "src/bin/routepro_plan.rs"

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
